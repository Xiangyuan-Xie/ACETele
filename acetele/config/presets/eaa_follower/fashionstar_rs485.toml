[basic]
model = "eaa_follower"
backend = "physical"
urdf_path = "../../../model/robots/eaa_follower/description/eaa_follower.urdf"

[buses.arm]
type = "fashionstar_rs485"
port = "/dev/ttyUSB1"
baudrate = 115200
cycle_hz = 25
direction_control = "auto"
external_estop = true
allow_unverified_identity = true

[arms.single]
bus = "arm"
tool_frame = "Link_4"

[[arms.single.joints]]
name = "Joint_1"
servo_id = 1
servo_model = "RX18-R100W-M"
firmware_version = 2051
direction = 1
home_position_rad = 0.0

