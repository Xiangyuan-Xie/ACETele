[basic]
model = "ace_follower"
backend = "physical"
urdf_path = "../../../model/robots/ace_follower/description/ace_follower.urdf"

[buses.arm]
type = "fashionstar_rs485"
port = "/dev/ttyUSB0"
baudrate = 115200
cycle_hz = 25
direction_control = "auto"
external_estop = true
allow_unverified_identity = true

[arms.single]
bus = "arm"
tool_frame = "link_5"

[[arms.single.joints]]
name = "joint_1"
servo_id = 1
servo_model = "HX8-R50W-M"
firmware_version = 316
direction = 1
home_position_rad = 0.0

