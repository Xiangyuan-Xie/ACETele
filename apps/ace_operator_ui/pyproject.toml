[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-operator-ui"
version = "0.1.0"
description = "Transport-neutral Qt operator monitor for ACETele"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.23,<3",
    "opencv-python>=4.8,<5",
    "PySide6>=6.5,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ace_operator_ui*"]
