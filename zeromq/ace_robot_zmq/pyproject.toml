[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-robot-zmq"
version = "0.2.0"
description = "Low-latency ZeroMQ teleoperation adapter for ACETele"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "acetele>=0.2,<0.3",
    "msgpack>=1.0,<2",
    "pyzmq>=25,<28",
]

[project.optional-dependencies]
camera = [
    "opencv-python-headless>=4.8,<5",
    "pyrealsense2>=2.55,<3; platform_machine == 'x86_64'",
    "zstandard>=0.22,<1",
]
visualization = [
    "ace-operator-ui>=0.2,<0.3",
    "opencv-python>=4.8,<5",
    "PySide6>=6.5,<7",
    "zstandard>=0.22,<1",
]

[project.scripts]
ace-robot-zmq = "ace_robot_zmq.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ace_robot_zmq*"]

[tool.setuptools.package-data]
ace_robot_zmq = ["ArmJointState.msg"]
